<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta name="theme-color" content="#110E0A">
<link rel="canonical" href="{{canon}}">
<link rel="alternate" hreflang="es" href="https://epic-gilgamesh.web.app/metodologia">
<link rel="alternate" hreflang="en" href="https://epic-gilgamesh.web.app/en/metodologia">
<link rel="alternate" hreflang="x-default" href="https://epic-gilgamesh.web.app/metodologia">
<style>
{{FONTS}}
:root{ --betun:#110E0A; --arena:#D2B385; --hueso:#ECE3D0; --hueso-2:#C9BDA6; --lapis:#2456A6;
  --f-display:"Cormorant Garamond", Georgia, serif; --f-texto:"Alegreya Sans", "Gill Sans", system-ui, sans-serif; }
*,*::before,*::after{ box-sizing:border-box; }
html{ background:var(--betun); color:var(--hueso); scrollbar-color:#4A3D2D var(--betun); }
body{ margin:0; font-family:var(--f-texto); font-size:clamp(16px,1vw + 7px,18px); line-height:1.7; -webkit-font-smoothing:antialiased; }
::selection{ background:var(--lapis); color:#fff; }
:focus-visible{ outline:1px solid var(--arena); outline-offset:4px; }
a{ color:var(--arena); text-underline-offset:.28em; text-decoration-thickness:1px; }
a:hover{ color:var(--hueso); }
.contenedor{ max-width:66ch; margin:0 auto; padding:clamp(48px,9vh,110px) 24px 96px; }
.arriba{ display:flex; justify-content:space-between; gap:24px; font-size:15px; margin-bottom:clamp(48px,8vh,88px); }
h1{ font-family:var(--f-display); font-weight:500; font-size:clamp(40px,4.5vw + 12px,68px); line-height:1.02; margin:0 0 28px; text-wrap:balance; }
h2{ font-family:var(--f-display); font-weight:500; font-size:clamp(28px,2vw + 12px,38px); line-height:1.1; margin:64px 0 16px; }
h3{ font-family:var(--f-display); font-weight:600; font-size:23px; margin:32px 0 8px; color:var(--arena); }
p, li{ color:#D3C8B2; }
strong{ color:var(--hueso); font-weight:500; }
.destacado{ font-family:var(--f-display); font-style:italic; font-weight:500; font-size:clamp(21px,1vw + 13px,26px); line-height:1.45; color:var(--arena); }
ul{ padding-left:1.1em; } li{ margin:.5em 0; }
.cun{ font-family:"CUN"; font-size:1.3em; color:var(--arena); }
.nota{ margin-top:72px; padding-top:28px; border-top:1px solid rgba(127,166,230,.4); }
.nota h2{ margin-top:0; font-size:26px; }
.pie{ display:flex; gap:28px; flex-wrap:wrap; margin-top:56px; font-size:15px; }
</style>
</head>
<body>
<main class="contenedor">
{{CUERPO}}
</main>
</body>
</html>
